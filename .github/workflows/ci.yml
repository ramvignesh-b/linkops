name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corepack otherwise stops to ask before fetching the pinned pnpm.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint below reads from the root commit, so the whole history
          # has to be present rather than the default shallow clone.
          fetch-depth: 0

      - name: Use the Node version the repo pins
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # corepack reads packageManager from package.json, so the pnpm running
      # here is the same one that wrote the lockfile.
      - name: Enable corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Hooks are bypassable with --no-verify, so the whole history is checked
      # here rather than trusting that every commit passed one on the way in.
      - name: Commit messages
        run: pnpm exec commitlint --from "$(git rev-list --max-parents=0 HEAD)" --to HEAD --verbose

      # --max-warnings=0 is what makes the complexity and function-length rules
      # binding; they are warnings locally so they do not block an edit midway.
      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Report Bundle Size & Sticky PR Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -d "dist/apps/console/browser" ]; then
            REPORT_FILE=$(mktemp)
            {
              echo "### 📦 Console Bundle Observability"
              echo "<!-- console-bundle-report -->"
              echo ""
              echo "| Asset | Raw Size | Gzip Transfer |"
              echo "| :--- | :--- | :--- |"
              for f in dist/apps/console/browser/*.js dist/apps/console/browser/*.css; do
                if [ -f "$f" ]; then
                  NAME=$(basename "$f")
                  RAW=$(ls -lh "$f" | awk '{print $5}')
                  GZIP=$(gzip -c "$f" | wc -c | awk '{printf "%.2f kB", $1/1024}')
                  echo "| \`$NAME\` | $RAW | $GZIP |"
                fi
              done
              echo ""
              echo "**Total Dist:** $(du -sh dist/apps/console/browser | awk '{print $1}')"
            } > "$REPORT_FILE"

            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY

            if [ -n "$PR_NUMBER" ]; then
              COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
                --jq '.[] | select(.body | contains("<!-- console-bundle-report -->")) | .id' \
                | head -n 1)

              if [ -n "$COMMENT_ID" ]; then
                gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
                  -F body=@"$REPORT_FILE"
              else
                gh pr comment "$PR_NUMBER" --body-file="$REPORT_FILE"
              fi
            fi
          fi
