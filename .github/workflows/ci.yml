name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corepack otherwise stops to ask before fetching the pinned pnpm.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint below reads from the root commit, so the whole history
          # has to be present rather than the default shallow clone.
          fetch-depth: 0

      - name: Use the Node version the repo pins
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # corepack reads packageManager from package.json, so the pnpm running
      # here is the same one that wrote the lockfile.
      - name: Enable corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Locate the Playwright browser version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('playwright-core/package.json').version)")" >> "$GITHUB_OUTPUT"

      # The Console's own build already exercises Playwright's browser
      # download once; this cache is what keeps every later CI run from
      # doing it again just to measure a bundle.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Hooks are bypassable with --no-verify, so the whole history is checked
      # here rather than trusting that every commit passed one on the way in.
      - name: Commit messages
        run: pnpm exec commitlint --from "$(git rev-list --max-parents=0 HEAD)" --to HEAD --verbose

      # --max-warnings=0 is what makes the complexity and function-length rules
      # binding; they are warnings locally so they do not block an edit midway.
      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Angular's own budgets (console's `esbuild` target) only see
      # main/polyfills/styles, and lumping Native Federation's shared-
      # dependency bundles into the same one number as this app's own code
      # was its own mistake — that cost is one-time, cacheable, and not
      # something a Console feature change can shrink. This gates only
      # this app's own code (main/polyfills/styles/its own route chunks),
      # measured for real against a real browser landing on `/`, and
      # reports the shared-dependency cost separately rather than folding
      # it in. See tools/verify-bundle-budget.mjs's header comment and
      # ADR-0015's "Consequences" for the two wrong attempts this replaced.
      - name: Verify bundle budget
        run: node tools/verify-bundle-budget.mjs dist/apps/console/browser 650 1000

      - name: Report Bundle Size & Sticky PR Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIST="dist/apps/console/browser"

          if [ -d "$DIST" ]; then
            REPORT_JSON=$(node tools/verify-bundle-budget.mjs "$DIST" 650 1000 --json)
            REPORT_FILE=$(mktemp)

            STATUS=$(echo "$REPORT_JSON" | jq -r '.status')
            WARN_KB=$(echo "$REPORT_JSON" | jq -r '.warnKb')
            ERROR_KB=$(echo "$REPORT_JSON" | jq -r '.errorKb')
            APP_RAW_KB=$(echo "$REPORT_JSON" | jq -r '(.appRawBytes / 1000) | round')
            APP_GZIP_KB=$(echo "$REPORT_JSON" | jq -r '(.appTransferBytes / 1000) | round')
            SHARED_RAW_KB=$(echo "$REPORT_JSON" | jq -r '(.sharedRawBytes / 1000) | round')
            SHARED_GZIP_KB=$(echo "$REPORT_JSON" | jq -r '(.sharedTransferBytes / 1000) | round')
            TOTAL_RAW_KB=$(echo "$REPORT_JSON" | jq -r '(.totalRawBytes / 1000) | round')
            TOTAL_GZIP_KB=$(echo "$REPORT_JSON" | jq -r '(.totalTransferBytes / 1000) | round')

            case "$STATUS" in
              error) BADGE="❌ Fail — app code over the ${ERROR_KB} kB error budget" ;;
              warn)  BADGE="⚠️ Warn — app code over the ${WARN_KB} kB warn budget" ;;
              *)     BADGE="✅ Pass — app code within the ${WARN_KB} kB warn budget" ;;
            esac

            row() {
              # $1 = bucket ("app"/"shared"), $2 = row label ("App"/"Shared")
              echo "$REPORT_JSON" | jq -r --arg bucket "$1" --arg label "$2" \
                '.entries | map(select(.bucket == $bucket)) | sort_by(-.rawBytes)[] | "| " + $label + " | `" + .file + "` | " + (((.rawBytes/1000*100|round)/100)|tostring) + " kB | " + (((.transferBytes/1000*100|round)/100)|tostring) + " kB |"'
            }

            {
              echo "### 📦 Console Bundle Observability"
              echo "<!-- console-bundle-report -->"
              echo ""
              echo "Measured, not guessed from filenames: a real headless browser, served the real production build (gzip included), landing on \`/\` — every byte every response actually carried before the Fleet table rendered."
              echo ""
              echo "#### 🚀 App code (gated: ${WARN_KB} kB warn / ${ERROR_KB} kB error, raw)"
              echo "This app's own code — \`main\`/\`polyfills\`/\`styles\`/its own route chunks. What a Console change can actually move."
              echo ""
              echo "| Type | Asset | Raw | Gzip |"
              echo "| :--- | :--- | ---: | ---: |"
              row app App
              echo "| | **App code total** | **${APP_RAW_KB} kB** | **${APP_GZIP_KB} kB** |"
              echo ""
              echo "**Budget status:** ${BADGE}"
              echo ""
              echo "#### 🧱 Shared infrastructure (reported, not gated)"
              echo "Native Federation's shared-dependency bundles — one-time, content-hashed, cacheable across every visit and every micro-frontend on this origin. Not something this app's own code controls; see [ADR-0015](../../blob/main/docs/adr/0015-assistant-as-a-module-federation-remote.md)."
              echo ""
              echo "| Type | Asset | Raw | Gzip |"
              echo "| :--- | :--- | ---: | ---: |"
              row shared Shared
              echo "| | **Shared infrastructure total** | **${SHARED_RAW_KB} kB** | **${SHARED_GZIP_KB} kB** |"
              echo ""
              echo "**Total first-load (informational):** ${TOTAL_RAW_KB} kB raw / ${TOTAL_GZIP_KB} kB gzip"
            } > "$REPORT_FILE"

            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY

            if [ -n "$PR_NUMBER" ]; then
              COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
                --jq '.[] | select(.body | contains("<!-- console-bundle-report -->")) | .id' \
                | head -n 1)

              if [ -n "$COMMENT_ID" ]; then
                gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
                  -F body=@"$REPORT_FILE"
              else
                gh pr comment "$PR_NUMBER" --body-file="$REPORT_FILE"
              fi
            fi
          fi
