name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corepack otherwise stops to ask before fetching the pinned pnpm.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint below reads from the root commit, so the whole history
          # has to be present rather than the default shallow clone.
          fetch-depth: 0

      - name: Use the Node version the repo pins
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # corepack reads packageManager from package.json, so the pnpm running
      # here is the same one that wrote the lockfile.
      - name: Enable corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Locate the Playwright browser version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('playwright-core/package.json').version)")" >> "$GITHUB_OUTPUT"

      # The Console's own build already exercises Playwright's browser
      # download once; this cache is what keeps every later CI run from
      # doing it again just to measure a bundle.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright's Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Hooks are bypassable with --no-verify, so the whole history is checked
      # here rather than trusting that every commit passed one on the way in.
      - name: Commit messages
        run: pnpm exec commitlint --from "$(git rev-list --max-parents=0 HEAD)" --to HEAD --verbose

      # --max-warnings=0 is what makes the complexity and function-length rules
      # binding; they are warnings locally so they do not block an edit midway.
      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Angular's own budgets (console's `esbuild` target) only see
      # main/polyfills/styles. This serves the real build and measures the
      # real bytes a headless browser downloads landing on `/` — the only
      # trustworthy number once Module Federation is in play; see
      # tools/verify-bundle-budget.mjs's header comment and ADR-0014's
      # "Consequences" for why a filename-based guess was tried first, was
      # wrong twice, and was replaced by actually asking a browser.
      #
      # `continue-on-error: true` because the true total is currently over
      # the 1000 kB error budget (~1,450 kB) — a real regression this check
      # exists to surface, not one this PR fixes. Blocking on it here would
      # make every PR red until that's remediated. Remove this line once
      # the bundle is back under budget and this can gate for real.
      - name: Verify bundle budget
        continue-on-error: true
        run: node tools/verify-bundle-budget.mjs dist/apps/console/browser 650 1000

      - name: Report Bundle Size & Sticky PR Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIST="dist/apps/console/browser"

          if [ -d "$DIST" ]; then
            REPORT_JSON=$(node tools/verify-bundle-budget.mjs "$DIST" 650 1000 --json)
            REPORT_FILE=$(mktemp)

            STATUS=$(echo "$REPORT_JSON" | jq -r '.status')
            WARN_KB=$(echo "$REPORT_JSON" | jq -r '.warnKb')
            ERROR_KB=$(echo "$REPORT_JSON" | jq -r '.errorKb')
            TOTAL_KB=$(echo "$REPORT_JSON" | jq -r '(.totalBytes / 1000) | round')
            REQUEST_COUNT=$(echo "$REPORT_JSON" | jq -r '.entries | length')

            case "$STATUS" in
              error) BADGE="❌ Fail — over the ${ERROR_KB} kB error budget" ;;
              warn)  BADGE="⚠️ Warn — over the ${WARN_KB} kB warn budget" ;;
              *)     BADGE="✅ Pass — within the ${WARN_KB} kB warn budget" ;;
            esac

            {
              echo "### 📦 Console Bundle Observability"
              echo "<!-- console-bundle-report -->"
              echo ""
              echo "#### 🚀 Real First-Load Payload (Budget: ${WARN_KB} kB warn / ${ERROR_KB} kB error)"
              echo ""
              echo "Measured, not guessed from filenames: a real headless browser, served the real production build, landing on \`/\` — every byte every response actually carried before the Fleet table rendered (\`${REQUEST_COUNT}\` requests). Angular's own bundler only tracks \`main\`/\`polyfills\`/\`styles\` as \"initial\"; this is what a first visit actually downloads, Native Federation's shared-dependency bundles included."
              echo ""
              echo "| Asset | Raw Size |"
              echo "| :--- | ---: |"
              echo "$REPORT_JSON" | jq -r '.entries | sort_by(-.bytes)[] | "| `\(.file)` | \(((.bytes/1000)*100|round)/100) kB |"'
              echo "| **Real first-load total** | **${TOTAL_KB} kB** |"
              echo ""
              echo "**Budget status:** ${BADGE}"
            } > "$REPORT_FILE"

            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY

            if [ -n "$PR_NUMBER" ]; then
              COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
                --jq '.[] | select(.body | contains("<!-- console-bundle-report -->")) | .id' \
                | head -n 1)

              if [ -n "$COMMENT_ID" ]; then
                gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
                  -F body=@"$REPORT_FILE"
              else
                gh pr comment "$PR_NUMBER" --body-file="$REPORT_FILE"
              fi
            fi
          fi
