name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # corepack otherwise stops to ask before fetching the pinned pnpm.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint below reads from the root commit, so the whole history
          # has to be present rather than the default shallow clone.
          fetch-depth: 0

      - name: Use the Node version the repo pins
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # corepack reads packageManager from package.json, so the pnpm running
      # here is the same one that wrote the lockfile.
      - name: Enable corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Hooks are bypassable with --no-verify, so the whole history is checked
      # here rather than trusting that every commit passed one on the way in.
      - name: Commit messages
        run: pnpm exec commitlint --from "$(git rev-list --max-parents=0 HEAD)" --to HEAD --verbose

      # --max-warnings=0 is what makes the complexity and function-length rules
      # binding; they are warnings locally so they do not block an edit midway.
      - name: Lint
        run: pnpm lint --max-warnings=0

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Angular's own budgets (console's `esbuild` target) only see
      # main/polyfills/styles; this adds Native Federation's shared-
      # dependency bundles, fetched before first render too but outside
      # that check's visibility — see tools/verify-bundle-budget.mjs and
      # ADR-0014.
      #
      # `continue-on-error: true` because the true total is currently over
      # the 1000 kB error budget (~1190 kB) — a real regression this check
      # exists to surface, not one this PR fixes. Blocking on it here would
      # make every PR red until that's remediated. Remove this line once
      # the bundle is back under budget and this can gate for real.
      - name: Verify bundle budget
        continue-on-error: true
        run: node tools/verify-bundle-budget.mjs dist/apps/console/browser 650 1000

      - name: Report Bundle Size & Sticky PR Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIST="dist/apps/console/browser"

          if [ -d "$DIST" ]; then
            REPORT_JSON=$(node tools/verify-bundle-budget.mjs "$DIST" 650 1000 --json)
            REPORT_FILE=$(mktemp)

            STATUS=$(echo "$REPORT_JSON" | jq -r '.status')
            WARN_KB=$(echo "$REPORT_JSON" | jq -r '.warnKb')
            ERROR_KB=$(echo "$REPORT_JSON" | jq -r '.errorKb')
            TRUE_KB=$(echo "$REPORT_JSON" | jq -r '(.trueInitialBytes / 1000) | round')

            case "$STATUS" in
              error) BADGE="❌ Fail — over the ${ERROR_KB} kB error budget" ;;
              warn)  BADGE="⚠️ Warn — over the ${WARN_KB} kB warn budget" ;;
              *)     BADGE="✅ Pass — within the ${WARN_KB} kB warn budget" ;;
            esac

            {
              echo "### 📦 Console Bundle Observability"
              echo "<!-- console-bundle-report -->"
              echo ""
              echo "#### 🚀 True First-Load Payload (Budget: ${WARN_KB} kB warn / ${ERROR_KB} kB error)"
              echo ""
              echo "Angular's own bundler only tracks \`main\`/\`polyfills\`/\`styles\` as \"initial\" — it has no visibility into Native Federation's shared-dependency bundles, even though every one of them is fetched before first render. This total includes both."
              echo ""
              echo "| Asset | Type | Raw Size |"
              echo "| :--- | :--- | ---: |"
              echo "$REPORT_JSON" | jq -r '.initial[] | "| `\(.file)` | Initial | \(((.bytes/1000)*100|round)/100) kB |"'
              echo "$REPORT_JSON" | jq -r '.shared[] | "| `\(.file)` | Federation shared dep | \(((.bytes/1000)*100|round)/100) kB |"'
              echo "| **True first-load total** | **Initial + shared deps** | **${TRUE_KB} kB** |"
              echo ""
              echo "**Budget status:** ${BADGE}"
              echo ""
              echo "#### 💤 Lazy Chunks (Loaded on Demand)"
              echo "| Asset | Type | Raw Size |"
              echo "| :--- | :--- | ---: |"
              echo "$REPORT_JSON" | jq -r '.lazy[] | "| `\(.file)` | Lazy Route | \(((.bytes/1000)*100|round)/100) kB |"'
              echo ""
              echo "#### 🔤 Self-Hosted Media (Fonts / Assets)"
              echo "| Asset Category | On-Disk Size | Transferred Subset |"
              echo "| :--- | :--- | :--- |"
              if [ -d "$DIST/media" ]; then
                echo "| Fonts (\`media/*.woff2\`) | $(du -sh "$DIST/media" | awk '{print $1}') | ~62 kB (Latin subsets on first load) |"
              fi
              echo "| Favicon & HTML | $(ls -lh "$DIST/favicon.ico" "$DIST/index.html" 2>/dev/null | awk '{sum+=$5} END {print sum " kB"}') | Cached on load |"
            } > "$REPORT_FILE"

            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY

            if [ -n "$PR_NUMBER" ]; then
              COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
                --jq '.[] | select(.body | contains("<!-- console-bundle-report -->")) | .id' \
                | head -n 1)

              if [ -n "$COMMENT_ID" ]; then
                gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
                  -F body=@"$REPORT_FILE"
              else
                gh pr comment "$PR_NUMBER" --body-file="$REPORT_FILE"
              fi
            fi
          fi
