<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkOps Console</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      The two faces the body text and every figure are set in, preloaded because
      the stylesheet that declares them is what discovers them, and a Console
      whose numbers reflow once the real face arrives is worse than one that
      waits a moment. Both are served from this application: see the @font-face
      block in styles.css for why there is no font CDN here.
    -->
    <link
      rel="preload"
      href="fonts/lexend-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/space-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
