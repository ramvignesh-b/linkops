<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LinkOps Console</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var routeIndex = path.indexOf('/links');
        var baseHref = '/';
        if (routeIndex > 0) {
          baseHref = path.substring(0, routeIndex + 1);
        } else if (path !== '/' && path !== '') {
          baseHref = path.endsWith('/') ? path : path + '/';
        }
        document.write('<base href="' + baseHref + '" />');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
