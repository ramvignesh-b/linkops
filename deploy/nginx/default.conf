map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container healthcheck endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Proxy API and SSE Stream requests (supporting /api/ and subpath /<subpath>/api/)
    location ~* ^(/[^/]+)?/api/(.*)$ {
        set $extracted_prefix $1;
        set $final_prefix $http_x_forwarded_prefix;
        if ($final_prefix = "") {
            set $final_prefix $extracted_prefix;
        }

        proxy_pass http://api:3000/api/$2$is_args$args;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix $final_prefix;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE (Server-Sent Events) streaming optimizations
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Module Federation manifests and dynamic discovery metadata (no-cache)
    location ~* (remoteEntry\.json|federation\.manifest\.json|importmap\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri /$1 /assistant/$1 /assistant/$uri =404;
    }

    # Dedicated Assistant remote route (handles /assistant/ and /assistant-remote/ and subpaths)
    location ~* /(?:assistant|assistant-remote)/(.*)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri /$1 /assistant/$1 =404;
    }

    # Static assets (including assistant remote components, shared libraries, and host bundles)
    location ~* (chunk-[^/]+\.js|main-[^/]+\.js|polyfills-[^/]+\.js|styles-[^/]+\.css|favicon\.ico|media/.*|Component-[^/]+\.js|_.*\.js|zod\..*\.js|tslib\..*\.js|rxjs.*\..*\.js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri /$1 /assistant/$1 =404;
    }

    # General static file extensions fallback
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri /$1 /assistant/$1 =404;
    }

    # Do not cache index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SPA Routing: Fallback to index.html for all client-side routes (including /linkops and subpaths)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
